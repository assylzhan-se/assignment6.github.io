<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
</head>
<body>
    <div id="box" style="width:200px; height:100px; background-color:lightblue; text-align:center; padding:10px;">
    This is a div container
  </div>
  <br>
  <button onclick="changeColor()">Change Background Color</button>
  <button onclick="changeFontSize()">Change Font Size</button>
   <script>
    function changeColor() {
      document.getElementById("box").style.backgroundColor = "lightgreen";
    }
    function changeFontSize() {
      document.getElementById("box").style.fontSize = "24px";
    }
  </script>
</body>
</html>
